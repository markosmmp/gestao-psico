<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#42573d">
  <meta name="description" content="Gestão administrativa do consultório de Juliana Maranho.">
  <title>Psych Admin — Juliana Maranho</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="./assets/icons/app-icon.svg">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Ir para o conteúdo</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <img src="./assets/images/brand-card.jpg" alt="Monograma JM de Juliana Maranho" width="728" height="409">
        <div class="brand-copy"><strong>Psych Admin</strong><span>Gestão do consultório</span></div>
      </div>
      <nav class="side-nav">
        <button class="nav-item active" data-route="dashboard" aria-current="page"><span aria-hidden="true">⌂</span> Visão geral</button>
        <button class="nav-item" data-route="patients"><span aria-hidden="true">♙</span> Pacientes</button>
        <button class="nav-item" data-route="agenda"><span aria-hidden="true">□</span> Agenda</button>
        <button class="nav-item" data-route="finance"><span aria-hidden="true">◇</span> Financeiro</button>
        <button class="nav-item" data-route="reports"><span aria-hidden="true">▥</span> Relatórios</button>
      </nav>
      <button class="nav-item settings-link" data-route="settings"><span aria-hidden="true">⚙</span> Configurações</button>
      <div class="privacy-note"><span aria-hidden="true">✦</span><span>Somente dados administrativos<br><small>Nenhuma informação clínica</small></span></div>
    </aside>

    <main id="main-content" class="main-content" tabindex="-1">
      <header class="topbar">
        <div><p class="eyebrow" id="today-label">Hoje</p><h1 id="page-title">Olá, Juliana</h1></div>
        <div class="top-actions"><button class="demo-exit-button" id="exit-demo" type="button" data-action="exit-demo">Sair do modo demo</button><span class="api-badge" id="api-status"><i></i> Modo de demonstração</span><div class="avatar" aria-label="Juliana Maranho"><img src="./assets/images/brand-card.jpg" alt="Marca de Juliana Maranho" width="728" height="409"></div></div>
      </header>

      <div id="app-view" aria-live="polite"><div class="empty-state"><strong>Carregando o sistema…</strong></div></div>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Navegação móvel">
    <button class="active" data-route="dashboard"><span>⌂</span>Início</button><button data-route="agenda"><span>□</span>Agenda</button><button data-action="quick-menu" class="fab" aria-label="Criar novo">＋</button><button data-route="patients"><span>♙</span>Pacientes</button><button data-route="finance"><span>◇</span>Financeiro</button>
  </nav>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
